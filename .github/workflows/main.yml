name: Deploy Android to Google Play Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Create local.properties
        run: |
          cat <<EOF > local.properties
          ID_INFO_PROFILE_FIREBASE=\"${{ secrets.ID_INFO_PROFILE_FIREBASE }}\"
          URL_MAIN_PAGE=\"${{ secrets.URL_MAIN_PAGE }}\"
          STORE_FILE=release.keystore
          STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      - name: Create google-services.json
        run: |
          cat <<EOF > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release AAB
        run: |
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          echo "Building versionCode $VERSION_CODE"
          ./gradlew bundleRelease -PversionCode="$VERSION_CODE" --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab

  deploy:
    name: Deploy to Google Play Production
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: .

      - name: Upload to Google Play Production
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON }}
          packageName: com.nullpointer.nullsiteadmin
          releaseFiles: ./*.aab
          track: production
          status: completed
